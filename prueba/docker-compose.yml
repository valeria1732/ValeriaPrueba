services:
  postgres:
    image: postgres:15-alpine
    container_name: gestopago-postgres
    restart: always
    environment:
      POSTGRES_DB: gestopago_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
