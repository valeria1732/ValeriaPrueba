# ===================================================================
# Configuración Servidor y Aplicación
# ===================================================================
server.port=${SERVER_PORT:8088}
spring.application.name=servicio-empresa
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ===================================================================
# Configuración Base de Datos PostgreSQL
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestopago_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# Consola Web SQL para consultar tablas desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Configuración de Integración Externa: GestoPago
# ===================================================================
# Credenciales y Autenticación
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalgp.com}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:1001}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:DEV_TEST_001}
gestopago.auth.password=${GESTOPAGO_PASSWORD:secret_password}
gestopago.auth.refresh-rate-ms=3600000

# Endpoint y Parámetros para Consulta de Productos
gestopago.product.url=${GESTOPAGO_PRODUCT_URL:https://gestopago.portalgp.com}
gestopago.product.token=${GESTOPAGO_PRODUCT_TOKEN:default_bearer_token}

# Timeouts y Configuración de Clientes OpenFeign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.config.gestoPagoProductClient.connectTimeout=5000
feign.client.config.gestoPagoProductClient.readTimeout=10000
feign.client.config.gestoPagoProductClient.loggerLevel=basic

# ===================================================================
# Logging
# ===================================================================
logging.level.com.proyecto.servicios=INFO
logging.level.com.proyecto.servicios.client=DEBUG
