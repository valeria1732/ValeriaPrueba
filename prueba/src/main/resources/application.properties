# ===================================================================
# Configuración Servidor y Aplicación
# ===================================================================
server.port=${PORT:${SERVER_PORT:8088}}
spring.application.name=servicio-empresa
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ===================================================================
# Configuración Base de Datos PostgreSQL
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestopago_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# Consola Web SQL para consultar tablas desde el navegador (deshabilitada en prod por defecto)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ===================================================================
# Configuración de Integración Externa: GestoPago (Variables de Entorno / Secret Manager)
# ===================================================================
# Credenciales y Autenticación
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalgp.com}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:1001}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:DEV_TEST_001}
gestopago.auth.password=${GESTOPAGO_AUTH_PASSWORD:}
gestopago.auth.refresh-rate-ms=${GESTOPAGO_AUTH_REFRESH_MS:3600000}

# Endpoint y Parámetros para Consulta de Productos y Transacciones SendTx
gestopago.product.url=${GESTOPAGO_PRODUCT_URL:https://gestopago.portalgp.com}
gestopago.transaction.url=${GESTOPAGO_TRANSACTION_URL:https://gestopago.portalventas.net}
gestopago.product.token=${GESTOPAGO_BEARER_TOKEN:}
gestopago.transaction.token=${GESTOPAGO_BEARER_TOKEN:}

# Timeouts y Configuración de Clientes OpenFeign
feign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:5000}
feign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:10000}
feign.client.config.gestoPagoProductClient.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:5000}
feign.client.config.gestoPagoProductClient.readTimeout=${FEIGN_READ_TIMEOUT_MS:10000}
feign.client.config.gestoPagoProductClient.loggerLevel=NONE
feign.client.config.gestoPagoTransactionClient.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:5000}
feign.client.config.gestoPagoTransactionClient.readTimeout=${FEIGN_READ_TIMEOUT_MS:10000}
feign.client.config.gestoPagoTransactionClient.loggerLevel=NONE

# ===================================================================
# Configuración Criptográfica AES y JWT (Inyectada por Variables de Entorno)
# ===================================================================
gestopago.security.aes-key=${GESTOPAGO_AES_KEY:GestoPagoAESSecretKey2026Secure32}
gestopago.security.aes-algorithm=${GESTOPAGO_AES_ALGORITHM:AES/CBC/PKCS5Padding}
gestopago.security.aes-iv=${GESTOPAGO_AES_IV:1234567890123456}
app.jwt.secret=${APP_JWT_SECRET:SuperSecretJwtSecretKeyForFinancialOnboarding2026!}

# ===================================================================
# Configuración Redis / Cache
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# ===================================================================
# Logging Seguro (Sin exposición de headers ni payloads sensibles)
# ===================================================================
logging.level.com.proyecto.servicios=INFO
logging.level.com.proyecto.servicios.client=WARN
logging.level.org.springframework.data.redis=INFO
